[package]
name = "ses-film"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
fframes = { version = "=1.2.0", features = ["compile-time-svgtree", "cli"] }
fframes_skia_renderer = { version = "=1.2.0", features = ["vulkan"] }
fframes_native_player = { version = "=1.2.0", default-features = false, features = ["vulkan"] }

[target.'cfg(not(windows))'.dependencies]
fframes = { version = "=1.2.0", features = ["h264", "libav-agree-gpl"] }

[lib]
name = "ses_film"
doctest = false

[workspace]
